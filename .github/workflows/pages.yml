# Publishes the docs site under docs/ to GitHub Pages.
#
# One-time setup: Settings -> Pages -> Source: GitHub Actions.
#
# The site is plain HTML and CSS with no build step, so this only uploads the
# folder. Assets are committed alongside the pages, which keeps the deploy
# reproducible and avoids a toolchain in CI.

name: Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
